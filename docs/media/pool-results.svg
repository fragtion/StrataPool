<svg xmlns="http://www.w3.org/2000/svg" width="760" height="476" viewBox="0 0 760 476" role="img" aria-labelledby="t d">
<title id="t">StrataPool: a desktop and a laptop as one, against each alone</title>
<desc id="d">Measured 2026-10-06 with tools/pool_bench.py (greedy, thinking off), Qwen3.8-Flash-Next coder IQ1_M. Writing speed, one chat: laptop alone 28.3 tok/s, desktop alone 41.2 (upstream Strata) and 39.4 (StrataPool), split pool 50.8 (+23%), with Overlap 52.0 (+26%), with Several chats at once 43.6 (+6%). Two chats at once: laptop 27.4, desktop 40.3, Share requests 49.8, split pool 52.5, split with Several chats 38.4, with drafts in several chats 43.0.</desc>
<style>
  .bg { fill: #fcfcfb; }
  .h { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0b0b0b; }
  .l { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #52514e; }
  .v { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0b0b0b; }
  .s { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #6b6a65; }
  .b { fill: #2a78d6; }
  .n { fill: #86b6ef; }
  .r { fill: #8f8e86; }
  .grid { stroke: #e4e3dd; stroke-width: 1; }
  .zero { stroke: #8f8e86; stroke-width: 1; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; }
    .h, .v { fill: #ffffff; }
    .l, .s { fill: #c3c2b7; }
    .b { fill: #3987e5; }
    .n { fill: #184f95; }
    .r { fill: #6b6a65; }
    .grid { stroke: #383835; }
  }
</style>
