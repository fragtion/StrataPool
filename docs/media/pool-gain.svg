<svg xmlns="http://www.w3.org/2000/svg" width="760" height="436" viewBox="0 0 760 436" role="img" aria-labelledby="t d">
<title id="t">StrataPool: speed with the laptop joined, against the desktop alone</title>
<desc id="d">Percent change in tokens per second written, desktop + laptop split pool against the desktop alone. Long agent prompts +37% (21-33 to 34-40 tok/s); one chat on a 7.6K-token prompt +26% with the default settings, +19% with Overlap, +6% with Several chats; two chats at once +26% one after the other, +7% with Several chats, -6% with drafts in several chats.</desc>
<style>
  .bg { fill: #fcfcfb; }
  .h { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0b0b0b; }
  .l { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #52514e; }
  .v { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0b0b0b; }
  .s { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #6b6a65; }
  .b { fill: #2a78d6; }
  .n { fill: #e34948; }
  .grid { stroke: #e4e3dd; stroke-width: 1; }
  .zero { stroke: #8f8e86; stroke-width: 1; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; }
    .h, .v { fill: #ffffff; }
    .l, .s { fill: #c3c2b7; }
    .b { fill: #3987e5; }
    .n { fill: #e66767; }
    .grid { stroke: #383835; }
    .zero { stroke: #8f8e86; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="436" rx="8"/>
<text class="s" x="16" y="24">Tokens per second written with the laptop joined, against the desktop alone on the same work (higher is better)</text>
<line class="zero" x1="391.4" y1="86" x2="391.4" y2="114"/>
<line class="zero" x1="391.4" y1="172" x2="391.4" y2="256"/>
<line class="zero" x1="391.4" y1="314" x2="391.4" y2="398"/>
<text class="s" x="391.4" y="418" text-anchor="middle">0%</text>
<line class="grid" x1="494.3" y1="86" x2="494.3" y2="114"/>
<line class="grid" x1="494.3" y1="172" x2="494.3" y2="256"/>
<line class="grid" x1="494.3" y1="314" x2="494.3" y2="398"/>
<text class="s" x="494.3" y="418" text-anchor="middle">+20%</text>
<line class="grid" x1="597.1" y1="86" x2="597.1" y2="114"/>
<line class="grid" x1="597.1" y1="172" x2="597.1" y2="256"/>
<line class="grid" x1="597.1" y1="314" x2="597.1" y2="398"/>
<text class="s" x="597.1" y="418" text-anchor="middle">+40%</text>
<line class="grid" x1="700.0" y1="86" x2="700.0" y2="114"/>
<line class="grid" x1="700.0" y1="172" x2="700.0" y2="256"/>
<line class="grid" x1="700.0" y1="314" x2="700.0" y2="398"/>
<text class="s" x="700.0" y="418" text-anchor="middle">+60%</text>
<text class="h" x="16" y="56">One chat, long agent prompts (40-80K tokens)</text>
<text class="s" x="16" y="74">against the desktop alone 21-33 tok/s</text>
<text class="l" x="318" y="103.5" text-anchor="end">Split, default settings</text>
<path class="b" d="M391.4,90 H577.7 Q581.7,90 581.7,94 V104 Q581.7,108 577.7,108 H391.4 Z"><title>Split, default settings: 34-40 tok/s, +37% against the desktop alone</title></path>
<text x="589.7" y="103.5"><tspan class="v">+37%</tspan><tspan class="s" dx="8">34-40 tok/s</tspan></text>
<text class="h" x="16" y="142">One chat, 7.6K-token prompt, 2-3K-token answer</text>
<text class="s" x="16" y="160">against the desktop alone about 35 tok/s</text>
<text class="l" x="318" y="189.5" text-anchor="end">Split, default settings</text>
<path class="b" d="M391.4,176 H521.1 Q525.1,176 525.1,180 V190 Q525.1,194 521.1,194 H391.4 Z"><title>Split, default settings: 44 tok/s, +26% against the desktop alone</title></path>
<text x="533.1" y="189.5"><tspan class="v">+26%</tspan><tspan class="s" dx="8">44 tok/s</tspan></text>
<text class="l" x="318" y="217.5" text-anchor="end">+ Overlap the PCs</text>
<path class="b" d="M391.4,204 H485.1 Q489.1,204 489.1,208 V218 Q489.1,222 485.1,222 H391.4 Z"><title>+ Overlap the PCs: 41-42 tok/s, +19% against the desktop alone</title></path>
<text x="497.1" y="217.5"><tspan class="v">+19%</tspan><tspan class="s" dx="8">41-42 tok/s</tspan></text>
<text class="l" x="318" y="245.5" text-anchor="end">+ Several chats at once</text>
<path class="b" d="M391.4,232 H418.3 Q422.3,232 422.3,236 V246 Q422.3,250 418.3,250 H391.4 Z"><title>+ Several chats at once: 35-39 tok/s, +6% against the desktop alone</title></path>
<text x="430.3" y="245.5"><tspan class="v">+6%</tspan><tspan class="s" dx="8">35-39 tok/s</tspan></text>
<text class="h" x="16" y="284">Two chats at the same time (both together)</text>
<text class="s" x="16" y="302">against the desktop alone about 35 tok/s, one after the other</text>
<text class="l" x="318" y="331.5" text-anchor="end">Split, one after the other (default)</text>
<path class="b" d="M391.4,318 H521.1 Q525.1,318 525.1,322 V332 Q525.1,336 521.1,336 H391.4 Z"><title>Split, one after the other (default): 44 tok/s, +26% against the desktop alone</title></path>
<text x="533.1" y="331.5"><tspan class="v">+26%</tspan><tspan class="s" dx="8">44 tok/s</tspan></text>
<text class="l" x="318" y="359.5" text-anchor="end">Several chats at once</text>
<path class="b" d="M391.4,346 H423.4 Q427.4,346 427.4,350 V360 Q427.4,364 423.4,364 H391.4 Z"><title>Several chats at once: 36-39 tok/s, +7% against the desktop alone</title></path>
<text x="435.4" y="359.5"><tspan class="v">+7%</tspan><tspan class="s" dx="8">36-39 tok/s</tspan></text>
<text class="l" x="318" y="387.5" text-anchor="end">+ Drafts in several chats</text>
<path class="n" d="M391.4,374 H364.6 Q360.6,374 360.6,378 V388 Q360.6,392 364.6,392 H391.4 Z"><title>+ Drafts in several chats: about 33 tok/s, -6% against the desktop alone</title></path>
<text x="399.4" y="387.5"><tspan class="v">−6%</tspan><tspan class="s" dx="8">about 33 tok/s</tspan></text>
</svg>
